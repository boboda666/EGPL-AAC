dataset: Clotho
evaluation_split: evaluation
seed: 42
event_adapter:
  input_dim: 768
  hidden_dim: 256
  num_classes: 527
  temporal_bins: 64
  depth: 3
  kernel_size: 5
  dropout: 0.1
  residual_scale: 0.1
preference:
  objective: dpo_with_chosen_caption_anchor
  pairs: 4345
  beta: 0.05
  anchor_weight: 0.01
  anchor_tolerance_per_token: 0.02
  learning_rate: 2.0e-6
  optimizer_updates: 544
  gradient_accumulation_steps: 8
decoding:
  method: beam_search
  num_beams: 4
