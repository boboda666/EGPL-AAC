[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egpl-aac"
version = "0.1.0"
description = "Method-specific implementation for EGPL-AAC"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["egpl_aac*"]
